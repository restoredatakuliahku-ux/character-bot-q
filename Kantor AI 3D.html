<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<style>
:root{--bg:#60a5fa;--panel:#172235;--ink:#f0f4f8;--mute:#a2b4cc;--line:#2e3e5c;--acc:#4ade80;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(255,255,255,0.94);--ink:#1a2332;--mute:#57677d;--line:#d3dfed;--acc:#16a34a}}
:root[data-theme="light"]{--panel:rgba(255,255,255,0.94);--ink:#1a2332;--mute:#57677d;--line:#d3dfed;--acc:#16a34a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:linear-gradient(180deg,#60a5fa 0%,#93c5fd 65%,#bfdbfe 100%);color:var(--ink);font:14px/1.45 ui-rounded,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#panel{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));width:320px;max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(15,28,50,0.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:10}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:rgba(74,222,128,0.18);color:var(--acc);font-size:11px;font-weight:700;border-radius:20px;letter-spacing:0.5px;margin-bottom:6px;text-transform:uppercase}
h1{font-size:18px;margin:0 0 3px;display:flex;align-items:center;gap:6px;font-weight:700}
.sub{color:var(--mute);margin:0 0 10px;font-size:12px;line-height:1.4}
.sum{display:flex;gap:12px;margin-bottom:12px;font-size:12.5px;color:var(--mute);background:rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;border:1px solid var(--line)}
.sum b{color:var(--acc);font-size:17px;margin-right:4px}
.ag{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:7px;cursor:pointer;transition:all .18s cubic-bezier(0.2,0.8,0.2,1)}
.ag:hover{background:rgba(255,255,255,0.08);border-color:var(--mute);transform:translateY(-1px)}
.ag:focus-visible{outline:2px solid var(--acc)}
.ag.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 25%,transparent)}
.top{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 6px currentColor}
.role{color:var(--mute);font-weight:400;font-size:11.5px;margin-left:auto}
.task{margin-top:4px;font-size:12px;color:var(--ink);opacity:0.92;line-height:1.35}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px;transition:width .3s linear}
.hint{color:var(--mute);font-size:11.5px;margin:8px 0 0;line-height:1.4}
@media (max-width:700px){#panel{left:10px;right:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:42%}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.ag{transition:none}}
</style></head>

const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=THREE.PCFSoftShadowMap;

const S=new THREE.Scene();
S.background=new THREE.Color(0x60a5fa);
S.fog=new THREE.FogExp2(0x93c5fd,0.009);

const cam=new THREE.PerspectiveCamera(45,1,.1,300);

// Pencahayaan

S.add(hemi);

const sun=new THREE.DirectionalLight(0xfffbeb,1.1);
sun.position.set(24,36,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:26,bottom:-26,near:1,far:100});

const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z,p=S){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
 m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;
 p.add(m);return m;
}

// -------------------------------------------------------------
// SISTEM PILL-SHAPED FLOATING BADGES (PERSIS SEPERTI DI GAMBAR)
// -------------------------------------------------------------
function nice(t){return t.replace(/\S+/g,w=>/[a-z\d]/.test(w)||w.length<=2||w==='XAUUSD'?w:w[0]+w.slice(1).toLowerCase())}
function makePillBadge(icon,text,bgCol,borderCol,scale=1){
 text=nice(text);const H=64,f='600 27px "Trebuchet MS",system-ui,sans-serif';
 const k=document.createElement('canvas');let g=k.getContext('2d');g.font=f;
 const W=Math.ceil(g.measureText(text).width)+44;k.width=W;k.height=H;g=k.getContext('2d');
 g.fillStyle='rgba(15,23,42,0.55)';g.beginPath();g.roundRect(2,10,W-4,H-20,22);g.fill();
 g.fillStyle='#fff';g.font=f;g.textAlign='center';g.textBaseline='middle';g.fillText(text,W/2,H/2+1);
 const tx=new THREE.CanvasTexture(k);tx.anisotropy=4;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));
 sp.scale.set(.62*scale*W/H,.62*scale,1);sp.renderOrder=10;return sp;
}

function addLocationBadge(icon,text,bgCol,x,y,z,scale=1){
 const b=makePillBadge(icon,text,bgCol,'rgba(255,255,255,0.4)',scale);
 b.position.set(x,y,z);
 S.add(b);
 return b;
}

// -------------------------------------------------------------
// AWAN-AWAN MELAYANG DI BAWAH PULAU
// -------------------------------------------------------------
const clouds=[];
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true});
function createCloud(scale=1){
 const cg=new THREE.Group();
 const n=5+Math.floor(Math.random()*4);
 for(let i=0;i<n;i++){
  const r=(1+Math.random()*1)*scale;
  const sph=new THREE.Mesh(new THREE.SphereGeometry(r,7,6),cloudMat);
  sph.position.set((i-n/2)*(1.2*scale)+(Math.random()-.5)*.5*scale,(Math.random()-.5)*.5*scale,(Math.random()-.5)*.8*scale);
  cg.add(sph);
 }
 return cg;
}
for(let i=0;i<40;i++){
 const sc=1.5+Math.random()*2;
 const cMesh=createCloud(sc);
 const cy=-4.5-Math.random()*7;
 cMesh.position.set((Math.random()-.5)*100,cy,(Math.random()-.5)*90);
 S.add(cMesh);
 clouds.push({mesh:cMesh,speed:.3+Math.random()*.4,baseY:cy,seed:Math.random()*10});
}

function createRobloxFace(d){
 const k=document.createElement('canvas');k.width=128;k.height=128;
 const g=k.getContext('2d');
 g.clearRect(0,0,128,128);

 g.fillStyle='#111';
 g.beginPath();g.arc(38,54,7.5,0,Math.PI*2);g.arc(90,54,7.5,0,Math.PI*2);g.fill();
 g.fillStyle='#fff';
 g.beginPath();g.arc(35,51,2.8,0,Math.PI*2);g.arc(87,51,2.8,0,Math.PI*2);g.fill();

 if(d.style==='finance'){
  g.strokeStyle='#1b1e23';g.lineWidth=4;
  g.strokeRect(20,38,32,30);g.strokeRect(76,38,32,30);
  g.beginPath();g.moveTo(52,50);g.lineTo(76,50);g.stroke();
 }else if(d.style==='receptionist'||d.style==='marketing'){
  g.fillStyle='rgba(255,105,135,0.45)';
  g.beginPath();g.ellipse(26,68,9,5,0,0,Math.PI*2);g.ellipse(102,68,9,5,0,0,Math.PI*2);g.fill();
 }
 g.strokeStyle='#111';g.lineWidth=3.5;g.beginPath();
 g.arc(64,76,14,0.15*Math.PI,0.85*Math.PI);g.stroke();

 return new THREE.CanvasTexture(k);
}

function makeCharacterBadge(name){
 const H=56,f='700 28px "Trebuchet MS",system-ui,sans-serif';
 const k=document.createElement('canvas');let g=k.getContext('2d');g.font=f;
 const W=Math.ceil(g.measureText(name).width)+36;k.width=W;k.height=H;g=k.getContext('2d');
 g.fillStyle='rgba(15,23,42,0.5)';g.beginPath();g.roundRect(0,6,W,H-12,18);g.fill();
 g.fillStyle='#fff';g.font=f;g.textAlign='center';g.textBaseline='middle';g.fillText(name,W/2,H/2+1);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(k),depthTest:false,transparent:true}));
 sp.scale.set(.5*W/H,.5,1);sp.renderOrder=11;return sp;
}

// NAVIGASI PATHFINDING KAMPUS VOXEL
function route(a,destKey){
 const c=a.g.position;
 const t=P[destKey];
 const path=[];
 path.push([c.x,c.z]);

 // Jalan melalui persimpangan tengah (0,0) jika jarak jauh antar pulau/zona
 if(Math.hypot(c.x-t.x,c.z-t.z)>7){
  // Titik keluar dari zona asal
  path.push([c.x>0?2:-2, c.z>0?2:-2]);
  // Titik tengah kampus
  path.push([a.lane, a.lane]);
  // Titik masuk ke zona tujuan
  path.push([t.x>0?2:-2, t.z>0?2:-2]);
 }

 path.push([t.x,t.z]);
 a.path=path.filter((p,idx,arr)=>idx===0||Math.hypot(p[0]-arr[idx-1][0],p[1]-arr[idx-1][1])>.1);
}

let total=0,follow=-1;const totEl=document.getElementById('tot');

// KONTROL KAMERA
let th=.82,ph=1.02,dist=64,thT=.82,phT=1.02,distT=38;
const tgt=new THREE.Vector3(0,.5,0);
let drag=false,px=0,py=0;

cv.addEventListener('pointerdown',e=>{
 drag=true;px=e.clientX;py=e.clientY;
 cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
});
cv.addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab';});
cv.addEventListener('pointermove',e=>{
 if(!drag)return;
 thT-=(e.clientX-px)*.006;
 phT=Math.min(1.35,Math.max(.35,phT-(e.clientY-py)*.005));
 px=e.clientX;py=e.clientY;
});
cv.addEventListener('wheel',e=>{
 e.preventDefault();
 distT=Math.min(65,Math.max(10,distT+e.deltaY*.028));
},{passive:false});

function size(){
 const w=innerWidth,h=innerHeight;
 R.setSize(w,h,false);
 cam.aspect=w/h;cam.updateProjectionMatrix();
 if(w<700&&distT<36)distT=42;
}
addEventListener('resize',size);size();

// LOOP UTAMA ANIMASI
const clk=new THREE.Clock();let T=0;
const HOME=new THREE.Vector3(0,.5,0);
const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));
const angD=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
A.forEach(a=>{a.sp=0;a.wp=Math.random()*6});
function tick(){
 requestAnimationFrame(tick);
 const dt=Math.min(clk.getDelta(),.05);T+=dt;

 // Awan berhembus perlahan
 clouds.forEach(c=>{
  c.mesh.position.x+=c.speed*dt;
  c.mesh.position.y=c.baseY+Math.sin(T*.5+c.seed)*.2;
  if(c.mesh.position.x>60) c.mesh.position.x=-60;
 });

 // LED Server kedap-kedip
 leds.forEach((l,i)=>{
  l.material.emissive.setHex(Math.sin(T*3+i*1.7)>-.2?0x00ff9c:0x003318);
 });

 // Animasi Karyawan (halus: akselerasi, blending pose)
 A.forEach((a,i)=>{
  const d=a.d,cur=d.t[a.k],g=a.g;
  let tSp=0,arms=[-.3,-.3];
  if(a.ph==='work'){
   a.tm-=dt;const sp=P[cur[0]];a.prog=1-Math.max(a.tm,0)/cur[2];
   g.rotation.y+=angD(g.rotation.y,Math.atan2(sp.lx-g.position.x,sp.lz-g.position.z))*(1-Math.exp(-6*dt));
   const c0=cur[0];
   if(c0==='sport'){arms=[-.4+Math.cos(T*6)*.2,-1.2+Math.sin(T*8)*.4]}
   else if(c0==='tambang'){arms=[-.5,-1.4+Math.sin(T*6)*.6]}
   else if(['trading','srv','rec','mkt','sup','hr'].includes(c0)){arms=[-.85+Math.sin(T*10+i)*.12,-.85+Math.cos(T*10+i)*.12]}
   else{arms=[-.3,-.3+Math.sin(T*3)*.1]}
   if(a.tm<=0){a.done++;total++;totEl.textContent=total;a.k=(a.k+1)%d.t.length;a.ph='walk';route(a,d.t[a.k][0])}
  }else{
   const w=a.path[0];
   if(!w){a.ph='work';a.tm=d.t[a.k][2];a.prog=0}
   else{
    let rem=0,px0=g.position.x,pz0=g.position.z;
    a.path.forEach(p=>{rem+=Math.hypot(p[0]-px0,p[1]-pz0);px0=p[0];pz0=p[1]});
    tSp=Math.min(2.6,.3+rem*1.3);
    a.sp=damp(a.sp,tSp,5,dt);
    const dx=w[0]-g.position.x,dz=w[1]-g.position.z,dd=Math.hypot(dx,dz),st=Math.max(a.sp,.2)*dt;
    if(dd<=st){g.position.x=w[0];g.position.z=w[1];a.path.shift()}
    else{g.position.x+=dx/dd*st;g.position.z+=dz/dd*st;
     g.rotation.y+=angD(g.rotation.y,Math.atan2(dx,dz))*(1-Math.exp(-9*dt))}
   }
  }
  if(tSp===0)a.sp=damp(a.sp,0,6,dt);
  const k=Math.min(1,a.sp/1.6);a.wp+=a.sp*dt*3.9;
  const sw=Math.sin(a.wp)*.72*k;
  a.legL.rotation.x=damp(a.legL.rotation.x,sw,22,dt);
  a.legR.rotation.x=damp(a.legR.rotation.x,-sw,22,dt);
  a.armL.rotation.x=damp(a.armL.rotation.x,-sw*k+arms[0]*(1-k),14,dt);
  a.armR.rotation.x=damp(a.armR.rotation.x,sw*k+arms[1]*(1-k),14,dt);
  a.model.position.y=damp(a.model.position.y,k*Math.abs(Math.sin(a.wp))*.055+(1-k)*Math.sin(T*3+i)*.015,20,dt);
  a.model.rotation.x=damp(a.model.rotation.x,k*.07,8,dt);
  a.headGroup.rotation.y=damp(a.headGroup.rotation.y,(1-k)*Math.sin(T*.7+i*2)*.3,4,dt);
  const walking=a.ph==='walk';
  const txt=walking?'Menuju '+P[d.t[a.k][0]].zone+': '+d.t[a.k][1]:d.t[a.k][1];
  if(a.tx.textContent!==txt)a.tx.textContent=txt;
  a.bar.style.width=(walking?0:a.prog*100)+'%';
 });

 // Kamera: damping tak bergantung frame rate
 th=damp(th,thT,8,dt);ph=damp(ph,phT,8,dt);dist=damp(dist,distT,4,dt);
 if(follow>=0)tgt.lerp(A[follow].g.position,1-Math.exp(-3*dt));
 else tgt.lerp(HOME,1-Math.exp(-2.5*dt));

 cam.position.set(
  tgt.x+dist*Math.sin(ph)*Math.sin(th),
  tgt.y+dist*Math.cos(ph),
  tgt.z+dist*Math.sin(ph)*Math.cos(th)
 );
 cam.lookAt(tgt);

 R.render(S,cam);
}
tick();
